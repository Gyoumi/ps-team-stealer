version: '3.8'

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    depends_on:
      - ollama
    volumes:
      - /root/ps-team-stealer/app:/app
    # Uncomment and set if your app needs to know the Ollama endpoint
    # environment:
    #   - OLLAMA_URL=http://ollama:11434

volumes:
  ollama_data: 